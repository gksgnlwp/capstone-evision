# 로컬 개발용 PostgreSQL
# 접속 정보는 같은 폴더의 .env 파일에서 읽는다 (.env.example 참고, .env는 커밋하지 않음)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - evision-pgdata:/var/lib/postgresql/data

volumes:
  evision-pgdata:
