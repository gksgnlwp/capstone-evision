spring:
  application:
    name: evision-backend
  datasource:
    # 로컬 bootRun: compose.yaml 컨테이너 접속 정보가 자동 주입된다 (spring-boot-docker-compose)
    # 테스트: Testcontainers(@ServiceConnection)가 주입한다
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
  task:
    scheduling:
      pool:
        size: 2                # 기본정보 갱신(수십 분)이 5분 상태 수집을 막지 않게

evision:
  evcharger:
    base-url: https://apis.data.go.kr/B552584/EvCharger   # 공식 페이지 기준 https (명세 초안은 http)
    service-key: ${DATA_GO_KR_SERVICE_KEY:}                # Decoding 키. Encoding 키(% 포함)를 넣으면 이중 인코딩으로 403
    page-size: 9999
    status-period-minutes: 10
    connect-timeout: 5s
    read-timeout: 60s
    max-retries: 3
    retry-initial-backoff: 2s  # 지수 백오프 시작값 (2s → 4s → 8s)
    status-time-budget: 4m     # 상태 수집 1회 전체 소요 상한 (5분 주기와 겹치지 않게)
    info-time-budget: 60m      # 기본정보 갱신 1회 전체 소요 상한 (전국 약 53페이지)
    daily-call-limit: 950
  collection:
    status-cron: "0 */5 * * * *"
    catalog-cron: "0 0 4 * * *"
    enabled: true              # 로컬·테스트에서 스케줄러 끄기용
    persist-batch-size: 1000   # 이력 적재 JDBC 배치 크기
    catalog-on-startup: false  # true면 앱 시작 직후 기본정보 갱신 1회 (첫 배포·로컬 확인용)
  charger:
    fast-rule:
      min-output-kw: 50        # TODO(확인 필요): 팀 기준 확정
      fast-type-codes: []      # TODO(확인 필요): 활용가이드 충전기 타입 코드표
  reference:
    load-on-startup: false     # true면 앱 시작 시 기준 데이터(노선·휴게소·IC)와 검증된 매핑 적재
    location: classpath:reference/
  aggregation:
    cron: "0 2,32 * * * *"
    min-valid-points: 3        # TODO(확인 필요): 박상현 님과 합의
    interpolate: false         # 보간 금지 (true는 아직 지원하지 않음)
    backfill-days: 0           # 매핑을 새로 적재했을 때 최근 N일 재집계 (시작 시 1회)
  recommend:
    average-speed-kmh: 80      # TODO(확인 필요): 도착 예정 시각 계산용 평균 속도
    road-distance-factor: 1.3  # 직선거리 → 도로거리 보정 (노선 이정 데이터 전 근사)
    history-weeks: 4           # 가용 확률 계산에 쓰는 occupancy_30m 기간
    forecast-max-age: 90m      # TODO(확인 필요): 이보다 오래된 AI 예측은 쓰지 않음 (예측 배치 주기와 맞출 것)
